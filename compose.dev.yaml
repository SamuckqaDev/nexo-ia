services:
  backend:
    environment:
      NEXO_MCP_DOCKER_GATEWAY_ENDPOINTS: fetch=http://mcp-fetch:8811/sse,duckduckgo=http://mcp-duckduckgo:8811/sse
      NEXO_MCP_DOCKER_GATEWAY_TOKEN: ${NEXO_MCP_GATEWAY_TOKEN:-nexo-local-mcp-gateway}
    ports:
      - "${NEXO_BIND_ADDRESS:-127.0.0.1}:${NEXO_SERVER_PORT:-8080}:8080"
    depends_on:
      mcp-fetch:
        condition: service_started
      mcp-duckduckgo:
        condition: service_started
    networks:
      - nexo-internal
      - nexo-edge
      - nexo-mcp

  mcp-fetch:
    image: docker/mcp-gateway@sha256:f5a679a05fc39022a046167bef92aeeb01bcd59485ad27843ae5227db7950688
    command:
      - --servers=fetch
      - --transport=sse
      - --host=0.0.0.0
      - --port=8811
    environment:
      MCP_GATEWAY_AUTH_TOKEN: ${NEXO_MCP_GATEWAY_TOKEN:-nexo-local-mcp-gateway}
    use_api_socket: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8811/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: on-failure:5
    networks:
      - nexo-mcp

  mcp-duckduckgo:
    image: docker/mcp-gateway@sha256:f5a679a05fc39022a046167bef92aeeb01bcd59485ad27843ae5227db7950688
    command:
      - --servers=duckduckgo
      - --transport=sse
      - --host=0.0.0.0
      - --port=8811
    environment:
      MCP_GATEWAY_AUTH_TOKEN: ${NEXO_MCP_GATEWAY_TOKEN:-nexo-local-mcp-gateway}
    use_api_socket: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8811/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: on-failure:5
    networks:
      - nexo-mcp

  postgres:
    ports:
      - "127.0.0.1:${NEXO_POSTGRES_DEV_PORT:-5432}:5432"
    networks:
      - nexo-internal
      - nexo-edge
  mailpit:
    image: docker.io/axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${NEXO_MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${NEXO_MAILPIT_HTTP_PORT:-8025}:8025"
    networks:
      - nexo-edge

  frontend-dev:
    image: docker.io/library/node:24-alpine
    working_dir: /workspace
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      NEXO_DEV_API_TARGET: http://backend:8080
    volumes:
      - ./frontend:/workspace:Z
      - nexo-frontend-node-modules:/workspace/node_modules
    ports:
      - "${NEXO_BIND_ADDRESS:-127.0.0.1}:${NEXO_FRONTEND_DEV_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_started
    networks:
      - nexo-edge

volumes:
  nexo-frontend-node-modules:

networks:
  nexo-mcp:
