name: nexo-ia

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${NEXO_WEB_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_started
    networks:
      - nexo-edge

  backend:
    build:
      context: ./backend
    environment:
      NEXO_DATABASE_URL: jdbc:postgresql://postgres:5432/${NEXO_DATABASE_NAME:-nexo}
      NEXO_DATABASE_USER: ${NEXO_DATABASE_USER:-nexo}
      NEXO_DATABASE_PASSWORD: ${NEXO_DATABASE_PASSWORD:?Set NEXO_DATABASE_PASSWORD in .env}
      NEXO_JWT_SECRET: ${NEXO_JWT_SECRET:?Set NEXO_JWT_SECRET in .env}
      NEXO_OLLAMA_BASE_URL: ${NEXO_CONTAINER_OLLAMA_BASE_URL:-http://host.containers.internal:11434}
      NEXO_PROVIDER_LOOPBACK_HOST: ${NEXO_CONTAINER_OLLAMA_HOST:-host.containers.internal}
      NEXO_SERVER_ADDRESS: 0.0.0.0
      NEXO_SERVER_PORT: 8080
      NEXO_SECURE_COOKIE: ${NEXO_SECURE_COOKIE:-false}
      NEXO_SMTP_HOST: ${NEXO_CONTAINER_SMTP_HOST:-host.containers.internal}
      NEXO_SMTP_PORT: ${NEXO_CONTAINER_SMTP_PORT:-1025}
      NEXO_MCP_ALLOW_PRIVATE_ENDPOINTS: ${NEXO_MCP_ALLOW_PRIVATE_ENDPOINTS:-false}
      NEXO_COMFYUI_BASE_URL: ${NEXO_CONTAINER_COMFYUI_BASE_URL:-http://host.containers.internal:8188}
      NEXO_MEDIA_IMAGE_DIRECTORY: /var/lib/nexo/media/images
    volumes:
      - nexo-media-data:/var/lib/nexo/media
    extra_hosts:
      - "host.containers.internal:host-gateway"
    depends_on:
      media-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - nexo-internal
      - nexo-edge

  media-init:
    build:
      context: ./backend
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mkdir -p /var/lib/nexo/media/images && chown -R 10001:10001 /var/lib/nexo/media
    volumes:
      - nexo-media-data:/var/lib/nexo/media
    network_mode: "none"
    restart: "no"

  postgres:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    environment:
      POSTGRES_DB: ${NEXO_DATABASE_NAME:-nexo}
      POSTGRES_USER: ${NEXO_DATABASE_USER:-nexo}
      POSTGRES_PASSWORD: ${NEXO_DATABASE_PASSWORD:?Set NEXO_DATABASE_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - nexo-postgres-data:/var/lib/postgresql
    networks:
      - nexo-internal

volumes:
  nexo-postgres-data:
  nexo-media-data:

networks:
  nexo-internal:
    internal: true
  nexo-edge:
